# Google AdMob, used by RELEASE builds. Both come from the AdMob console:
#   appId           Apps > Cash Paws > App settings > App ID
#   rewardedAdUnit      Apps > Cash Paws > Ad units > Rewarded_admob
#   interstitialAdUnit  Apps > Cash Paws > Ad units > the interstitial unit
#
# One rewarded unit serves both placements (Rescue Sort, Rewards Box early).
# The interstitial shows after level 10, at most once per 2.5 minutes of play,
# only between levels. Leave it blank to switch interstitials off.
# Debug builds ignore this file and always use Google's test IDs, so testing
# can never put the account at risk.
# Leave rewardedAdUnit blank and a release builds with ads switched off.
appId=ca-app-pub-5379524261124242~4778314769
rewardedAdUnit=ca-app-pub-5379524261124242/4914046139
interstitialAdUnit=ca-app-pub-5379524261124242/7986846311
