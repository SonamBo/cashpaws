plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/**
 * The app's identity (name, package, version, privacy URL) lives in one file,
 * www/app.config.js, which the shell reads too. Strict JSON after the
 * "export default".
 */
def appConfig = new groovy.json.JsonSlurper().parseText(
    rootProject.file('../www/app.config.js').text
        .replaceAll(/(?m)^\s*\/\/.*$/, '')
        .replaceFirst(/(?s)^.*?export default/, '')
        .replaceFirst(/;\s*$/, ''))

// Firebase (Analytics and Crashlytics) switches on when app/google-services.json
// is present. Without it the app builds and runs, and sends no events.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

/**
 * Release signing is read from the environment so no key ever enters the repo.
 * With nothing set, the release build is simply unsigned and the debug build
 * still works, so a fresh clone builds without any setup.
 */
def keystorePath = System.getenv('KEYSTORE_FILE')

def adsProps = new Properties()
def adsFile = rootProject.file('ads.properties')
if (adsFile.exists()) adsFile.withInputStream { adsProps.load(it) }

android {
    // The code's own package. Internal: it never changes, whatever the app is
    // published as (applicationId, below), so shell updates merge cleanly.
    namespace 'com.pixelartgames.cashpaw'
    compileSdk 35

    buildFeatures { buildConfig true }   // carries the ad keys in

    defaultConfig {
        applicationId appConfig.applicationId
        minSdk 24
        targetSdk 36
        // From www/app.config.js. Play rejects a versionCode it has seen
        // before: bump it there for every upload.
        versionCode appConfig.versionCode as int
        versionName appConfig.versionName
        // Android resource strings need apostrophes escaped ("Sam's Game").
        resValue 'string', 'app_name', appConfig.name.replace("'", "\\'")
        // Play Games (CloudSave.java): the project ID from Play Console, or empty for off.
        resValue 'string', 'game_services_project_id', (appConfig.playGamesAppId ?: '').toString()
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    // Play serves per-device slices from the bundle; this is what makes an AAB
    // smaller than the equivalent APK.
    bundle {
        language { enableSplit true }
        density { enableSplit true }
        abi { enableSplit true }
    }

    // AdMob. Release builds use the real IDs from android/ads.properties; debug
    // builds always use Google's published test IDs. The manifest's app ID can
    // never be blank: the SDK crashes at launch without one, so a release with
    // no app ID falls back to the test ID (and, with no ad unit, shows no ads).
    def TEST_APP_ID = 'ca-app-pub-3940256099942544~3347511713'
    def TEST_REWARDED = 'ca-app-pub-3940256099942544/5224354917'
    def TEST_INTERSTITIAL = 'ca-app-pub-3940256099942544/1033173712'
    def realAppId = adsProps.getProperty('appId', '').trim()
    def realRewarded = adsProps.getProperty('rewardedAdUnit', '').trim()
    def realInterstitial = adsProps.getProperty('interstitialAdUnit', '').trim()

    buildTypes {
        release {
            manifestPlaceholders = [admobAppId: realAppId ?: TEST_APP_ID]
            buildConfigField 'String', 'ADS_REWARDED_UNIT', "\"${realRewarded}\""
            buildConfigField 'String', 'ADS_INTERSTITIAL_UNIT', "\"${realInterstitial}\""
            signingConfig keystorePath ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            manifestPlaceholders = [admobAppId: TEST_APP_ID]
            buildConfigField 'String', 'ADS_REWARDED_UNIT', "\"${TEST_REWARDED}\""
            buildConfigField 'String', 'ADS_INTERSTITIAL_UNIT', "\"${TEST_INTERSTITIAL}\""
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    packaging {
        resources { excludes += ['META-INF/*.kotlin_module'] }
    }
}

// Kotlin 2.2 made the old `kotlinOptions {}` block an error; this is its replacement.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Google AdMob, and its consent SDK (UMP) for the US privacy message.
    // Pinned, not '+': a new release must not change the build unasked.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // Google Play Billing: coin packs (Billing.java). Play requires version 8+
    // for new uploads from 31 Aug 2026; 9.x needs androidx.core 1.9+ (below).
    implementation 'com.android.billingclient:billing:9.1.0'
    // Google Play Games v2: sign-in and Saved Games, the cloud copy of the save (CloudSave.java).
    implementation 'com.google.android.gms:play-services-games-v2:22.1.0'
    // Google Play's in-app review sheet (Social.java).
    implementation 'com.google.android.play:review:2.0.2'
    // Firebase, versions from the BoM. google-services.json covers both
    // com.pixelartgames.cashpaw and its .debug build, which report as
    // separate apps so testing never mixes with real players.
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    // Remote Config (1.19.0): tuning values and A/B tests from the Firebase console.
    implementation 'com.google.firebase:firebase-config'
    // webkit gives WebViewAssetLoader, which serves the game from a real https
    // origin. On file:// the WebView refuses ES modules and sandboxes storage.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    // The ad SDK pulls in an old androidx.fragment (pre-1.3) whose
    // FragmentActivity breaks registerForActivityResult (the notification
    // permission ask). Release lint stops the build on it, so pin a modern one.
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // Reminders: WorkManager keeps scheduled notifications across restarts.
    implementation 'androidx.work:work-runtime:2.10.0'
}

/**
 * The game lives in ../../www and is copied into assets at build time, so there
 * is exactly one copy of the source. Never edit app/src/main/assets/www by hand.
 * The dev harness inside index.html only appears with ?dev=1, so it ships inert.
 */
tasks.register('copyWebApp', Copy) {
    from rootProject.file('../www')
    into layout.projectDirectory.dir('src/main/assets/www')
}

tasks.named('preBuild') { dependsOn('copyWebApp') }
