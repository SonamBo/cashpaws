// AGP 8.7.3 + Gradle 8.9 + compileSdk 35 + targetSdk 36: the combination that
// works on the runner without needing to download the API 36 preview SDK.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    // Firebase: reads app/google-services.json, and uploads Crashlytics mappings.
    id 'com.google.gms.google-services' version '4.5.0' apply false
    id 'com.google.firebase.crashlytics' version '3.0.8' apply false
}
